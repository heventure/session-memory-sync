name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Test
        run: npm test

      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Pack smoke test + assert tarball contents
        run: |
          npm pack
          TARBALL=$(ls session-memory-sync-*.tgz | head -1)
          echo "Packed $TARBALL"
          LISTING=$(tar -tzf "$TARBALL")
          echo "$LISTING"
          require() {
            echo "$LISTING" | grep -E "$1" >/dev/null || {
              echo "MISSING from tarball: $1" >&2
              exit 1
            }
          }
          # npm pack paths are package/<file>
          require '^package/SKILL\.md$'
          require '^package/scripts/common\.py$'
          require '^package/scripts/agents\.py$'
          require '^package/scripts/sync_push\.py$'
          require '^package/scripts/sync_pull\.py$'
          require '^package/package\.json$'
          require '^package/README\.md$'
          require '^package/LICENSE$'
          tar -xzf "$TARBALL" -C /tmp
          node -e "const p=require('/tmp/package/package.json'); if(p.name!=='session-memory-sync') process.exit(1)"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
